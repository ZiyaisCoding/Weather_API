name: Weather-API

services:

  redis:
    image: redis:8.6-alpine
    container_name: redis_server
    restart: always

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf

    command: redis-server /usr/local/etc/redis/redis.conf

  redisinsight:
    image: redis/redisinsight:3.8
    container_name: redis_insight
    depends_on:
      - redis

    restart: always

    ports:
      - "5540:5540"

  app:
    build: .
    container_name: python_app
    restart: always

    ports:
      - "${API_PORT}:8000"

    volumes:
      - ./app:/app

    depends_on:
      - redis

volumes:
  redis_data:
    name: redis_data